*{margin:0;padding:0;box-sizing:border-box}
:root{--negro:#1a1614;--taupe:#574545;--olivo:#7a7157;--olivo-d:#605838;--crema:#f3efe9;--linea:rgba(243,239,233,.28)}
body{font-family:'Josefin Sans',sans-serif;-webkit-font-smoothing:antialiased;color:var(--crema);font-weight:300}
.eyebrow{font-size:26px;letter-spacing:.34em;text-transform:uppercase;color:#d8cfc0;font-weight:400}
h1,.cinzel{font-family:'Cinzel',serif}
.strike{position:relative;display:inline-block;color:#c9bfa9;opacity:.85}
.strike:after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:3px;background:#b06a5a;transform:rotate(-7deg)}
.pill{display:inline-block;border:1.5px solid var(--crema);border-radius:6px;color:var(--crema);text-transform:uppercase;letter-spacing:.22em;font-weight:500}
.step-num{font-family:'Cinzel',serif;color:#e6dcc8}
.disc{color:#b9ae9c;font-weight:300}

.stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--negro)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,16,.94) 0%,rgba(20,18,16,.86) 38%,rgba(20,18,16,.45) 66%,rgba(20,18,16,.15) 100%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:96px 110px;max-width:1180px}
.logo{width:250px;height:auto;margin-bottom:22px}
.label{font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--olivo);font-weight:600;margin:30px 0 16px}
.hero-row{display:flex;align-items:flex-end;gap:34px}
.big{font-family:'Cinzel',serif;font-size:250px;line-height:.85;font-weight:600;color:#fff;letter-spacing:-2px}
.hero-side{padding-bottom:24px}
.strike-line{font-family:'Cinzel',serif;font-size:52px;margin-bottom:8px}
.mes{font-size:52px;color:#f3efe9;letter-spacing:.04em}
.sub18{font-size:26px;letter-spacing:.16em;color:#d8cfc0;text-transform:uppercase;margin-top:8px}
.steps{display:flex;align-items:center;gap:22px;margin:44px 0 30px}
.step .n{font-family:'Cinzel',serif;font-size:21px;letter-spacing:.14em;color:#e6dcc8;text-transform:uppercase;margin-bottom:8px}
.step .d{font-size:24px;color:#cfc7b8;line-height:1.3;max-width:260px}
.arrow{color:var(--olivo);font-size:36px}
.rule{width:520px;height:1px;background:var(--linea);margin:2px 0 30px}
.price{font-family:'Cinzel',serif;font-size:42px;color:#fff}
.price small{font-family:'Josefin Sans';font-size:28px;color:#d8cfc0;font-weight:300;margin-left:14px}
.bottom{display:flex;align-items:center;gap:40px;margin-top:40px}
.pill{padding:24px 58px;font-size:28px}
.foot{font-size:22px;letter-spacing:.1em;color:#c9bfa9}
.foot .disc{display:block;font-size:18px;margin-top:6px}
